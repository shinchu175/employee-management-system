{% extends "base.html" %}

{% block title %}
Edit Employee
{% endblock %}


{% block content %}

<div class="row justify-content-center">

    <div class="col-lg-9">

        <div class="mb-4">

            <h2 class="page-title mb-1">
                Edit Employee
            </h2>

            <p class="text-muted mb-0">
                Update employee information.
            </p>

        </div>


        <div class="card p-4">

            <form method="POST">

                <h5 class="mb-3">
                    Employee Information
                </h5>


                <div class="row g-3">

                    <!-- Employee Code -->

                    <div class="col-md-6">

                        <label class="form-label">
                            Employee Code
                        </label>

                        <input
                            type="text"
                            class="form-control"
                            value="{{ employee.employee_code }}"
                            disabled
                        >

                        <div class="form-text">
                            Employee code cannot be changed.
                        </div>

                    </div>


                    <!-- Email -->

                    <div class="col-md-6">

                        <label class="form-label">
                            Email *
                        </label>

                        <input
                            type="email"
                            name="email"
                            class="form-control"
                            value="{{ employee.email }}"
                            required
                        >

                    </div>


                    <!-- First Name -->

                    <div class="col-md-6">

                        <label class="form-label">
                            First Name *
                        </label>

                        <input
                            type="text"
                            name="first_name"
                            class="form-control"
                            value="{{ employee.first_name }}"
                            required
                        >

                    </div>


                    <!-- Last Name -->

                    <div class="col-md-6">

                        <label class="form-label">
                            Last Name *
                        </label>

                        <input
                            type="text"
                            name="last_name"
                            class="form-control"
                            value="{{ employee.last_name }}"
                            required
                        >

                    </div>


                    <!-- Phone -->

                    <div class="col-md-6">

                        <label class="form-label">
                            Phone
                        </label>

                        <input
                            type="text"
                            name="phone"
                            class="form-control"
                            value="{{ employee.phone or '' }}"
                        >

                    </div>


                    <!-- Department -->

                    <div class="col-md-6">

                        <label class="form-label">
                            Department
                        </label>

                        <input
                            type="text"
                            name="department"
                            class="form-control"
                            value="{{ employee.department or '' }}"
                        >

                    </div>


                    <!-- Designation -->

                    <div class="col-md-6">

                        <label class="form-label">
                            Designation
                        </label>

                        <input
                            type="text"
                            name="designation"
                            class="form-control"
                            value="{{ employee.designation or '' }}"
                        >

                    </div>


                    <!-- Joining Date -->

                    <div class="col-md-6">

                        <label class="form-label">
                            Joining Date
                        </label>

                        <input
                            type="date"
                            name="joining_date"
                            class="form-control"
                            value="{% if employee.joining_date %}{{ employee.joining_date.strftime('%Y-%m-%d') }}{% endif %}"
                        >

                    </div>


                    <!-- Salary -->

                    <div class="col-md-6">

                        <label class="form-label">
                            Salary
                        </label>

                        <input
                            type="number"
                            name="salary"
                            class="form-control"
                            value="{{ employee.salary if employee.salary is not none else '' }}"
                            step="0.01"
                            min="0"
                        >

                    </div>


                    <!-- City -->

                    <div class="col-md-6">

                        <label class="form-label">
                            City
                        </label>

                        <input
                            type="text"
                            name="city"
                            class="form-control"
                            value="{{ employee.city or '' }}"
                        >

                    </div>


                    <!-- Address -->

                    <div class="col-12">

                        <label class="form-label">
                            Address
                        </label>

                        <textarea
                            name="address"
                            class="form-control"
                            rows="3"
                        >{{ employee.address or '' }}</textarea>

                    </div>

                </div>


                <!-- Buttons -->

                <div class="d-flex gap-2 mt-4">

                    <button
                        type="submit"
                        class="btn btn-primary"
                    >
                        Save Changes
                    </button>


                    <a
                        href="{{ url_for(
                            'admin.view_employee',
                            employee_id=employee.id
                        ) }}"
                        class="btn btn-secondary"
                    >
                        Cancel
                    </a>

                </div>

            </form>

        </div>

    </div>

</div>

{% endblock %}
