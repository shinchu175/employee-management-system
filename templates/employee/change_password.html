{% extends "base.html" %}

{% block title %}
Change Password
{% endblock %}

{% block content %}

<div class="row justify-content-center">

    <div class="col-lg-6">

        <div class="mb-4">
            <h2 class="page-title mb-1">
                Change Password
            </h2>

            <p class="text-muted mb-0">
                Update your employee account password.
            </p>
        </div>

        <div class="card p-4">

            <form method="POST">

                <div class="mb-3">

                    <label class="form-label">
                        Current Password
                    </label>

                    <input
                        type="password"
                        name="current_password"
                        class="form-control"
                        placeholder="Enter current password"
                        required
                    >

                </div>


                <div class="mb-3">

                    <label class="form-label">
                        New Password
                    </label>

                    <input
                        type="password"
                        name="new_password"
                        class="form-control"
                        placeholder="Enter new password"
                        minlength="6"
                        required
                    >

                    <div class="form-text">
                        Password must be at least 6 characters.
                    </div>

                </div>


                <div class="mb-3">

                    <label class="form-label">
                        Confirm New Password
                    </label>

                    <input
                        type="password"
                        name="confirm_password"
                        class="form-control"
                        placeholder="Confirm new password"
                        minlength="6"
                        required
                    >

                </div>


                <div class="alert alert-info">

                    Choose a password that you do not use for other accounts.

                </div>


                <div class="d-flex gap-2">

                    <button
                        type="submit"
                        class="btn btn-primary"
                    >
                        Change Password
                    </button>

                    <a
                        href="{{ url_for('employee.dashboard') }}"
                        class="btn btn-secondary"
                    >
                        Cancel
                    </a>

                </div>

            </form>

        </div>

    </div>

</div>

{% endblock %}
