{% extends "base.html" %}

{% block title %}
Edit Profile
{% endblock %}


{% block content %}

<div class="row justify-content-center">

    <div class="col-lg-7">

        <div class="mb-4">

            <h2 class="page-title mb-1">
                Edit Profile
            </h2>

            <p class="text-muted mb-0">
                Update the information you are allowed to change.
            </p>

        </div>


        <div class="card p-4">

            <form method="POST">

                <!-- Phone -->

                <div class="mb-3">

                    <label class="form-label">
                        Phone
                    </label>

                    <input
                        type="text"
                        name="phone"
                        class="form-control"
                        value="{{ employee.phone or '' }}"
                        placeholder="Enter phone number"
                    >

                </div>


                <!-- City -->

                <div class="mb-3">

                    <label class="form-label">
                        City
                    </label>

                    <input
                        type="text"
                        name="city"
                        class="form-control"
                        value="{{ employee.city or '' }}"
                        placeholder="Enter city"
                    >

                </div>


                <!-- Address -->

                <div class="mb-3">

                    <label class="form-label">
                        Address
                    </label>

                    <textarea
                        name="address"
                        class="form-control"
                        rows="4"
                        placeholder="Enter address"
                    >{{ employee.address or '' }}</textarea>

                </div>


                <!-- Information -->

                <div class="alert alert-info">

                    You can update your phone number, city and address.
                    Other employee information can only be changed by an administrator.

                </div>


                <!-- Buttons -->

                <div class="d-flex gap-2">

                    <button
                        type="submit"
                        class="btn btn-primary"
                    >
                        Save Changes
                    </button>


                    <a
                        href="{{ url_for('employee.profile') }}"
                        class="btn btn-secondary"
                    >
                        Cancel
                    </a>

                </div>

            </form>

        </div>

    </div>

</div>

{% endblock %}
